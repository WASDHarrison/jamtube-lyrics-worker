# Builds the worker's container image on every push to main, ready to run anywhere:
# ghcr.io/<owner>/jamtube-lyrics-worker, `latest` with an NVIDIA GPU, `cpu` without one.
name: Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kind: gpu
            tag: latest
          - kind: cpu
            tag: cpu
    steps:
      - uses: actions/checkout@v4
      # The GPU image is several GB: room for it on the runner.
      - name: Make room
        if: matrix.kind == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: KIND=${{ matrix.kind }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
